name = "paraacco-document-worker"
main = "src/index.ts"
compatibility_date = "2026-09-02"

# 這個 worker 沒有任何公開 HTTP 用途(fetch() 一律回 404,只靠 queue consumer 跟 Service
# Binding 被呼叫),明確關掉 *.workers.dev 網址,不留不必要的公開入口
# (見 apps/api/wrangler.toml、src/access-jwt.ts 同一批安全性補強,2026-09-06)。
workers_dev = false

[[r2_buckets]]
binding = "FILES"
bucket_name = "paraacco-files"

# 這個 worker 刻意不掛 D1 binding——所有寫入(OCR 結果、文件狀態更新、job/event 記錄)一律
# 呼叫 paraacco-api 的 /internal/* 端點(見 src/internal-client.ts),不直接寫資料庫。

[[services]]
binding = "API"
service = "paraacco-api"

[[queues.consumers]]
queue = "paraacco-document-ingest"
max_batch_size = 5
max_retries = 5
# max_retries 用完之後訊息會被丟棄(除非另外設定 dead_letter_queue,見部署清單待辦)。
# document-worker 內部失敗(pipeline 執行到一半出錯)不算在這個重試次數裡 ——
# 那種情況 Workflow 自己的 step.do() retry 設定 / decide('failed') 落地處理,
# 這裡的重試只涵蓋「claim 或建立 Workflow 實例本身失敗」的情況(見 src/index.ts)。

[[workflows]]
name = "paraacco-document-processing"
binding = "DOCUMENT_PROCESSING_WORKFLOW"
class_name = "DocumentProcessingWorkflow"

# Workers AI —— 備援 OCR/欄位擷取供應商(2026-09-03 選定、2026-09-04 起改為備援,見
# @paraacco/ocr 的 cloudflare-workers-ai-provider.ts 開頭註解)。有每日免費 Neuron 額度,
# 不需要另外的 API Key/secret,帳號預設不會超額自動轉計費。
[ai]
binding = "AI"

# 擷取模式開關(2026-09-23,見 CODE_TASK_extraction-writeback-api_20260923.md、
# CODE_REPORT_extraction-writeback-api-phase2-proposals_20260923.md 提案 2)——
# 'external':stage-3-ocr 不呼叫 Gemini,只寫入 _ocr_status=awaiting_external_extraction
#   佔位欄位,等待 apps/api 的 POST /api/extraction-writeback/documents/:id 寫回真實結果。
# 'gemini':維持現行行為,呼叫 GeminiOcrProvider。
# 非 'gemini' 的任何值(含未設定/打錯字)一律當成 'external'——刻意設計成「設定壞掉時誤停
# Gemini,不會誤呼叫 Gemini」的安全方向,避免打錯字意外燒到 Gemini 額度/費用。之後要切回
# Gemini,只改下面這個值 + 重新部署,不用動程式碼。不是敏感值,用 [vars](不是 secret)。
[vars]
EXTRACTION_MODE = "external"

# INTERNAL_SERVICE_TOKEN 用 secret 設定,不寫在這個檔案裡:
#   npx wrangler secret put INTERNAL_SERVICE_TOKEN
# 要跟 apps/api 那邊設的值完全一樣。
#
# GEMINI_API_KEY 一樣用 secret 設定,不寫在這裡:
#   npx wrangler secret put GEMINI_API_KEY
# 實際 OCR/欄位擷取供應商用(2026-09-04 決策,見 @paraacco/ocr 的 gemini-provider.ts 開頭
# 註解)。申請 key 時務必用沒有連結 Cloud Billing 帳戶的 Google Cloud 專案,確保免費層
# 保證不收費。
