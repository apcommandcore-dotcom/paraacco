name = "paraacco-api"
main = "src/index.ts"
compatibility_date = "2026-09-02"

# 明確關掉 *.workers.dev 這個預設網址(2026-09-06,見 src/access-jwt.ts 開頭註解)——
# 這個網址不受 Cloudflare Access 保護,只留自訂網域這一個進來的路徑,降低攻擊面。就算
# workers.dev 網址還開著,現在 whoami.ts 也已經改成驗證 JWT 簽章、不再直接信任 header,
# 這裡是額外一層縱深防禦,不是唯一防線。
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "paraacco-db"
database_id = "78b6cf4d-22fa-40df-b0e3-988b4c2dd906"

[[r2_buckets]]
binding = "FILES"
bucket_name = "paraacco-files"

[[queues.producers]]
binding = "DOCUMENT_QUEUE"
queue = "paraacco-document-ingest"

# 自訂網域 —— 掛到既有的 *.parallelserver.org 底下,讓這個 Worker 自動落在既有的
# 「AP Internal Platform」Cloudflare Access Application(萬用字元涵蓋)保護範圍內,不用
# 另外設 Access 規則。用 custom_domain(不是 path-based route),Cloudflare 部署時會自動幫這個
# 子網域建好 DNS 紀錄,不需要手動先加 CNAME。
#
# 子網域名稱是建議值,不是定案 —— apps/web 之後決定部署方式時,可能會想把 acco.parallelserver.org
# 留給前端整個網域、API 改用路徑(acco.parallelserver.org/api/*)走同網域避免 CORS。部署前
# 請先確認這個名稱沒問題,或改成你想要的子網域。
[[routes]]
pattern = "acco-api.parallelserver.org"
custom_domain = true

# INTERNAL_SERVICE_TOKEN 用 secret 設定,不寫在這個檔案裡:
#   npx wrangler secret put INTERNAL_SERVICE_TOKEN
# 要跟 apps/document-worker 那邊設的值完全一樣。
